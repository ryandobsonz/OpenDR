# Campaign missions converted from the original game by --import-dr-campaign.
# Their scenario, trigger and AI files run through DrScenarioScript.

World:
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal
	DebugScreenshots:

Player:
	ModularBot@DrCampaign:
		Name: bot-dr-campaign.name
		Type: dr-campaign
	GrantConditionOnBotOwner@DrCampaign:
		Condition: enable-dr-campaign-ai
		Bots: dr-campaign
	DrAipBotModule:
		RequiresCondition: enable-dr-campaign-ai

# Plan stealing: an infiltrator escapes the facility it enters with its plans, and
# they count as stolen once it is back at its own headquarters.
^Headquarters:
	DrPlanSource:
	Targetable:
		TargetTypes: Ground, C4, DetonateAttack, Structure, SpyInfiltrate

^TrainingFacility:
	DrPlanSource:
	Targetable:
		TargetTypes: Ground, C4, DetonateAttack, Structure, SpyInfiltrate

^AssemblyPlant:
	DrPlanSource:
	Targetable:
		TargetTypes: Ground, C4, DetonateAttack, Structure, SpyInfiltrate

Infiltrator:
	Infiltrates:
		EnterBehaviour: Exit
	DrCarriesPlans:

# Damage reports, for the original's harass-a-region condition.
^ExistsInWorld:
	DrReportsDamage:
